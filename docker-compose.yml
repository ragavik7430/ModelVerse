version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: modelverse_db
    environment:
      POSTGRES_USER: modelverse_user
      POSTGRES_PASSWORD: modelverse_password
      POSTGRES_DB: modelverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelverse_user -d modelverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
